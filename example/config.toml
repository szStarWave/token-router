# Token Router — 推荐示例配置
#
# 复制:
#   Linux/macOS: cp example/config.toml ~/.token-router/config.toml
#   Windows:     copy example\config.toml %USERPROFILE%\.token-router\config.toml
#
# Electron 嵌入：也可复制打包产物 config/config.toml 到上述路径
# 或直接指定:
#   token-router --config example/config.toml gateway start
#   make start CONFIG=example/config.toml

# ---------------------------------------------------------------------------
# Gateway
# ---------------------------------------------------------------------------
[gateway]
listen = "127.0.0.1:11080"

# 端/云/级联总开关（仅配置文件控制，请求头不能覆盖）
#   auto     — 按难度 + profile + routing_mode 自动选择
#   edge     — 全部端侧（仅 edge 上游；失败即报错，不升云）
#   cloud    — 全部云端
#   cascade  — 每请求先 edge，质量不过关再升 cloud
route = "auto"

# 仅 route = "auto" 时生效:
#   single   — 低难度 edge，否则 cloud
#   cascade  — 低 edge；中 先 edge 再可能升 cloud；高 cloud
#   split    — 当前实现等同全部 cloud
routing_mode = "cascade"

# 难度阈值策略: economy | balanced | premium | privacy
default_profile = "balanced"

# 端侧上下文 token 上限；超过约 80% 触发 GATE_CTX_OVERFLOW → 走云
ctx_edge_max_tokens = 65536

# 可选：入站鉴权（Authorization: Bearer 或 x-api-key）
# api_key = "token-local"

# 可选：保护 POST /v1/admin/shutdown（头 X-Token-Router-Admin-Token）
# admin_token = "change-me"

# --- 经验学习（持久化 experience.json）---
# experience_enabled = true
# experience_learning_rate = 0.08      # 偏置更新强度
# experience_max_bias = 0.12           # 单 step_kind 偏置上限
# experience_target_fallback = 0.15    # 级联回退目标比例（自适应路由参考）
# cloud_sticky_ttl_secs = 600        # 升云后会话粘性 TTL；日常/心跳不受粘性门控；Work 执行走 Cascade 重试；端侧成功清除
# session_persist_enabled = true
# session_retention_days = 7           # 过期 session 保留天数；0 = 不删过期项（仍清理损坏/tmp）
# session_cleanup_interval_secs = 3600   # sessions/ 扫描间隔（秒）；改后需重启 Gateway

# --- Work 步态云端校验（ToolSelect 等）---
# work_verify_sample_rate = 0.1        # 0=不校验，1=每步校验；默认 0.1

# --- 运行时自适应（仅内存，不写回配置；见 token-router stats 自适应分区）---
# adaptive_routing_enabled = true
# adaptive_min_verified_samples = 20   # 预热：云验证样本不足时用上面基线
# adaptive_verify_rate_floor = 0.05
# adaptive_verify_rate_ceiling = 0.45
# adaptive_max_theta_shift = 0.05      # 健康时放宽 θ_edge，提高端侧占比

# --- 贝叶斯分类器（持久化 classifier.json）---
# classifier_enabled = true
# classifier_min_samples = 100        # 低于此值完全使用启发式 difficulty
# classifier_prior_alpha = 1.0        # Laplace 平滑
# classifier_decay_half_life_hours = 168
# classifier_prior_from_heuristic = true

# --- 日志轮转（~/.token-router/logs/gateway.log）---
# log_max_size_mb = 10               # 单文件超过此大小（MiB）时轮转；0 = 禁用
# log_max_files = 5                  # 保留文件总数（当前 + 归档）；至少 2 才启用轮转

# ---------------------------------------------------------------------------
# 上游（OpenAI 兼容 Chat Completions）
# ---------------------------------------------------------------------------
[upstream.edge]
base_url = "http://127.0.0.1:11434/v1"
# model = "qwen3"          # 端侧上游模型；setup 默认不创建 edge 段
# api_key = "ollama"

[upstream.cloud]
base_url = "https://api.deepseek.com/v1"
model = "auto"               # auto = 保留客户端 model，由 token-router 路由
# api_key = "sk-your-deepseek-api-key"

# ---------------------------------------------------------------------------
# CLI
# ---------------------------------------------------------------------------
[cli]
# gateway_url = "http://127.0.0.1:11080"

