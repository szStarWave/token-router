[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.20.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
