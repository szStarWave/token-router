[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.20.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.43", features = ["bundled"] }
thiserror = "2"
toml = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.cargo]
# P0a 阶段部分 crate 只有骨架、依赖已按目标架构声明（依赖方向门禁需要它们）。
# 代码落地后应移除本 allow，让陈旧的依赖暴露出来。
unused_dependencies = "allow"
